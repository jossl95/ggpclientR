name: R-CMD-check
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # the Python package ggp_client, so that the equivalence test (tests/testthat/test-equivalence.R) runs
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyarrow "git+https://github.com/jossl95/ggp_client"
      - run: echo "RETICULATE_PYTHON=$(which python)" >> "$GITHUB_ENV"
      - uses: r-lib/actions/setup-r@v2
        with: {use-public-rspm: true}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with: {extra-packages: "any::rcmdcheck", needs: check}
      - uses: r-lib/actions/check-r-package@v2
