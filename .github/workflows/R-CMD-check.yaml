name: R-CMD-check
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # the shared fixtures must be the Python package's: the contract both test against
      - uses: actions/checkout@v4
        with: {repository: jossl95/ggp_client, path: ggp_client_python}
      - run: diff -r -x README.md ggp_client_python/tests/fixtures/portal tests/testthat/fixtures/portal && diff -r ggp_client_python/tests/fixtures/expected tests/testthat/fixtures/expected && diff -r ggp_client_python/tests/fixtures/labels tests/testthat/fixtures/labels && diff -r ggp_client_python/tests/fixtures/ffs tests/testthat/fixtures/ffs
      # the Python package ggp_client, so that the equivalence test (tests/testthat/test-equivalence.R) runs
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyarrow "git+https://github.com/jossl95/ggp_client"
      - run: echo "RETICULATE_PYTHON=$(which python)" >> "$GITHUB_ENV"
      - uses: r-lib/actions/setup-r@v2
        with: {use-public-rspm: true}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with: {extra-packages: "any::rcmdcheck", needs: check}
      - uses: r-lib/actions/check-r-package@v2
