<script>
// Line the navbar up with the page: the title starts at the body text's left edge, and the right menu (R/Python,
// GitHub, dark mode, search) starts above "On this page", or at the body text's right edge on a page without one.
// Without room there (narrow screens) the menu ends at the body text's right edge.
// Quarto's page grid differs per screen width, so measure instead of fixing a width in CSS.
(() => {
  const nav = document.querySelector(".navbar-container"), main = document.querySelector("main.content");
  if (!nav || !main) return;
  const pad = () => {  // move the outer elements by the distance between them and the body text
    const shown = [...nav.children].map(e => e.getBoundingClientRect()).filter(b => b.width > 0);
    if (!shown.length) return;
    const m = main.getBoundingClientRect(), s = getComputedStyle(nav);
    const left = Math.min(...shown.map(b => b.left)), right = Math.max(...shown.map(b => b.right));
    nav.style.paddingLeft = Math.max(0, parseFloat(s.paddingLeft) + m.left - left) + "px";
    const icon = nav.querySelector(".navbar-nav.ms-auto i"), toc = document.querySelector("#toc-title");
    const wide = matchMedia("(min-width: 992px)").matches && icon && icon.getBoundingClientRect().width > 0;
    const x = toc && toc.getBoundingClientRect().width > 0 ? toc.getBoundingClientRect().left : m.right;  // where the first icon goes
    const beside = wide ? x + right - icon.getBoundingClientRect().left : Infinity;  // where the last icon then ends
    const end = beside <= right + parseFloat(s.paddingRight) ? beside : m.right;
    nav.style.paddingRight = Math.max(0, parseFloat(s.paddingRight) + right - end) + "px";
  };
  const fit = () => {
    nav.style.paddingLeft = nav.style.paddingRight = "";
    pad(); pad();  // the menu reflows once padded: a second pass takes up what is left
  };
  addEventListener("resize", fit);
  addEventListener("load", fit);  // again once Quarto's scripts have filled in the search button
  fit();
})();
</script>
