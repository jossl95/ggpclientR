project:
  type: website
  output-dir: _site

website:
  title: "ggpclient"
  description: "Download, label and consolidate data from the GGP data portal, in R."
  site-url: https://jossl95.github.io/ggpclientR/
  repo-url: https://github.com/jossl95/ggpclientR
  repo-actions: [source, issue]
  navbar:
    left:
      - text: "0.1.0"  # the package version: keep in step (the docs workflow checks)
      - getting-started.qmd
      - reference.qmd
      - text: Articles
        menu:
        - ggs-ii.qmd
        - labels.qmd
        - ffs.qmd
        - contract.qmd
    right:
      - icon: python
        href: https://jossl95.github.io/ggp_client/
        aria-label: Python package
      - icon: github
        href: https://github.com/jossl95/ggpclientR
  page-footer:
    center: "ggpclient is not affiliated with the Generations and Gender Programme. The data stays subject to the GGP terms of use."

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    code-copy: true
    css: styles.css
